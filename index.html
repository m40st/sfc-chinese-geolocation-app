<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SFC 中国語学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS (デジタル庁デザインシステム準拠・ダークテーマ)
   ============================================================ */
:root {
  --bg:       #000000;
  --sf:       #0f0f0f;
  --sf2:      #1a1a1a;
  --bd:       #282828;
  --bd2:      #1f1f1f;
  --tx:       #ffffff;
  --tx2:      #888888;
  --tx3:      #444444;
  --accent:   #7f5af0;
  --acc-dim:  rgba(127,90,240,.1);
  --ok:       #2cb67d;
  --warn:     #ff8906;
  --danger:   #ef4565;
  --radius:   6px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
  background:var(--bg);color:var(--tx);
  min-height:100vh;overflow-x:hidden;line-height:1.6;font-size:15px;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;align-items:center;min-height:100vh;}
.screen.active{display:flex;}

/* ── STICKY HEADER ── */
.sticky-hd{
  position:sticky;top:0;z-index:30;
  width:100%;background:var(--bg);
  border-bottom:1px solid var(--bd);
}
.hd-inner{
  width:100%;max-width:900px;margin:0 auto;
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.hd-left{display:flex;align-items:center;gap:10px;}
.hd-title{font-size:1rem;font-weight:700;line-height:1.3;}
.hd-sub{font-size:.75rem;color:var(--tx2);margin-top:1px;}
.btn-back{
  background:none;border:1px solid var(--bd);border-radius:var(--radius);
  color:var(--tx2);font-size:.8rem;padding:5px 10px;white-space:nowrap;
  transition:border-color .15s,color .15s;
}
.btn-back:hover{border-color:var(--accent);color:var(--tx);}

/* ── CONTENT WRAPPER ── */
.w{width:100%;max-width:900px;margin:0 auto;}

/* ============================================================
   HOME SCREEN
   ============================================================ */
#s-home{justify-content:flex-start;}
.home-title-block{
  width:100%;padding:20px 20px 12px;
  border-bottom:1px solid var(--bd2);
}
.home-title-block h1{font-size:1.1rem;font-weight:700;}
.home-title-block p{font-size:.8rem;color:var(--tx2);margin-top:3px;}

/* Building grid */
.bld-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  padding:16px 20px;
  width:100%;
}
@media(min-width:640px){
  .bld-grid{grid-template-columns:1fr 1fr;}
}
.bld-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--radius);
  transition:border-color .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.bld-card:hover,.bld-card:active{border-color:var(--accent);background:var(--sf2);}
.bld-abbr{
  width:40px;height:40px;flex-shrink:0;
  background:var(--sf2);border:1px solid var(--bd);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:700;color:var(--tx2);letter-spacing:-.02em;
  font-family:'Noto Sans JP',sans-serif;
}
.bld-info{flex:1;min-width:0;}
.bld-name{font-size:.9rem;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bld-desc{font-size:.75rem;color:var(--tx2);margin-top:1px;}
.bld-counts{font-size:.72rem;color:var(--tx3);margin-top:4px;}
.bld-arr{color:var(--tx3);font-size:.9rem;flex-shrink:0;}

/* Home nav */
.home-nav{
  width:100%;max-width:900px;
  padding:0 20px 40px;
  display:flex;gap:8px;
}
.btn-nav{
  flex:1;padding:11px 8px;
  background:var(--sf);border:1px solid var(--bd);
  color:var(--tx2);border-radius:var(--radius);
  font-size:.85rem;font-weight:500;
  transition:border-color .15s,color .15s,background .15s;
}
.btn-nav:hover{border-color:var(--accent);color:var(--tx);background:var(--sf2);}

/* ============================================================
   STATE PICKER MODAL
   ============================================================ */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.8);z-index:100;
  align-items:flex-end;justify-content:center;
}
.modal-bg.open{display:flex;}
@media(min-width:640px){
  .modal-bg.open{align-items:center;}
  .modal-box{border-radius:var(--radius)!important;max-width:480px;}
}
.modal-box{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:12px 12px 0 0;
  width:100%;max-width:600px;padding:24px 20px 44px;
}
.modal-bname{font-size:1rem;font-weight:700;margin-bottom:2px;}
.modal-sub{font-size:.8rem;color:var(--tx2);margin-bottom:16px;}

/* State button grid */
.state-section-label{
  font-size:.72rem;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:8px;
}
.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.btn-state{
  padding:12px 10px;
  border:1px solid var(--bd);border-radius:var(--radius);
  background:var(--sf2);color:var(--tx);
  font-size:.85rem;font-weight:700;
  text-align:left;line-height:1.3;
  transition:border-color .15s,background .15s;
}
.btn-state .s-ct{font-size:.7rem;color:var(--tx3);margin-top:2px;}
.btn-state:hover:not(:disabled){border-color:var(--accent);background:var(--acc-dim);}
.btn-state:disabled{opacity:.3;cursor:default;}
.btn-state-all{
  width:100%;padding:12px;
  border:1px solid var(--accent);border-radius:var(--radius);
  background:var(--acc-dim);color:var(--accent);
  font-size:.875rem;font-weight:700;
  margin-bottom:16px;
  transition:background .15s;
}
.btn-state-all:hover{background:rgba(127,90,240,.18);}

.modal-divider{
  height:1px;background:var(--bd);margin:8px 0 14px;
}
.modal-list-btn{
  display:block;width:100%;padding:11px 14px;
  background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);
  color:var(--tx);font-size:.875rem;text-align:left;
  margin-bottom:8px;
  transition:border-color .15s,background .15s;
}
.modal-list-btn:hover{border-color:var(--accent);background:var(--acc-dim);}
.btn-cancel{
  display:block;width:100%;padding:10px;
  background:transparent;border:none;
  color:var(--tx3);font-size:.875rem;margin-top:4px;
  transition:color .15s;
}
.btn-cancel:hover{color:var(--tx2);}

/* ============================================================
   PRACTICE SCREEN
   ============================================================ */
#s-practice{justify-content:center;padding:20px 16px;min-height:100vh;}
.prac-wrap{
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;
}
.p-header{
  width:100%;display:flex;justify-content:space-between;
  margin-bottom:14px;font-size:.85rem;color:var(--tx2);
}
.p-card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--radius);
  padding:28px 24px 20px;
  width:100%;text-align:center;margin-bottom:12px;
}
.p-state-tag{
  display:inline-block;font-size:.8rem;font-weight:700;
  padding:3px 10px;border-radius:4px;margin-bottom:14px;
}
.p-zh{font-size:1.5rem;font-weight:700;line-height:1.4;margin-bottom:10px;}
.p-ja{font-size:.875rem;color:var(--tx2);margin-bottom:8px;}
.p-pinyin{
  font-size:1.3rem;font-style:italic;min-height:1.8rem;
  margin-bottom:6px;transition:color .2s;
}
.p-pinyin.ok{color:var(--ok);}
.p-pinyin.ng{color:var(--warn);}
.p-status{
  font-size:.85rem;min-height:1.8rem;padding:5px 12px;
  border-radius:4px;margin-top:6px;transition:all .2s;
}
.p-status.idle{color:var(--tx3);}
.p-status.listening{color:var(--accent);background:var(--acc-dim);}
.p-status.ok{color:var(--ok);background:rgba(44,182,125,.1);}
.p-status.ng{color:var(--warn);background:rgba(255,137,6,.1);}
.p-recog{font-size:.8rem;color:var(--tx3);min-height:1rem;margin-top:3px;}
.p-btn-row{display:flex;gap:10px;width:100%;}
.btn-mic{
  flex:1;padding:13px;
  background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius);font-size:.875rem;font-weight:700;
  transition:background .15s;
}
.btn-mic:hover{background:#6b46e0;}
.btn-mic.rec{background:var(--danger);animation:pulse 1.2s infinite;}
.btn-next{
  flex:1;padding:13px;
  background:var(--ok);color:#fff;border:none;
  border-radius:var(--radius);font-size:.875rem;font-weight:700;
  transition:background .15s;
}
.btn-next:hover{background:#249f60;}
.btn-abort{
  background:transparent;border:1px solid var(--bd);
  color:var(--tx2);font-size:.8rem;padding:7px 16px;
  border-radius:var(--radius);margin-top:8px;
  transition:border-color .15s,color .15s;
}
.btn-abort:hover{border-color:var(--danger);color:var(--danger);}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,69,101,.4);}
  50%{box-shadow:0 0 0 12px rgba(239,69,101,0);}
}

/* ============================================================
   RESULT SCREEN
   ============================================================ */
#s-result{justify-content:center;padding:20px 16px;}
.res-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}
.r-title{font-size:.9rem;color:var(--tx2);margin-bottom:14px;text-align:center;}
.r-card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);
  padding:36px;width:100%;text-align:center;margin-bottom:16px;
}
.r-big{font-size:4.5rem;font-weight:700;line-height:1;margin-bottom:4px;}
.r-denom{font-size:1rem;color:var(--tx2);margin-bottom:12px;}
.r-rate{font-size:1.6rem;font-weight:700;margin-bottom:6px;}
.r-comment{font-size:.85rem;color:var(--tx2);}
.r-btns{display:flex;flex-direction:column;gap:8px;width:100%;}
.btn-retry{
  padding:12px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius);font-size:.875rem;font-weight:700;
}
.btn-retry:hover{background:#6b46e0;}
.btn-wrong{
  padding:12px;background:var(--sf2);color:var(--warn);
  border:1px solid var(--warn);border-radius:var(--radius);
  font-size:.875rem;font-weight:700;
}
.btn-wrong:hover{background:rgba(255,137,6,.08);}
.btn-home-sm{
  padding:10px;background:transparent;
  border:1px solid var(--bd);color:var(--tx2);
  border-radius:var(--radius);font-size:.85rem;
}
.btn-home-sm:hover{border-color:var(--tx2);color:var(--tx);}

/* ============================================================
   SCROLL SCREENS (HISTORY / PHRASES / VOCAB)
   ============================================================ */
#s-history,#s-phrases,#s-vocab{justify-content:flex-start;padding:0;}

.list-actions{
  width:100%;padding:10px 20px;
  display:flex;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--bd2);
}
.btn-action{
  padding:7px 14px;
  background:var(--sf2);border:1px solid var(--bd);
  color:var(--tx2);border-radius:var(--radius);font-size:.8rem;
  transition:border-color .15s,color .15s,background .15s;
  white-space:nowrap;
}
.btn-action:hover{border-color:var(--accent);color:var(--tx);background:var(--acc-dim);}
.btn-action.prim{
  background:var(--acc-dim);border-color:var(--accent);color:var(--accent);
}

/* Filter tab strip */
.filter-tabs{
  width:100%;padding:10px 20px;
  overflow-x:auto;white-space:nowrap;
  border-bottom:1px solid var(--bd);
  scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{display:none;}
.filter-tab{
  display:inline-block;padding:5px 12px;
  background:var(--sf2);border:1px solid var(--bd);
  border-radius:4px;color:var(--tx2);font-size:.8rem;
  margin-right:6px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.filter-tab:hover{border-color:var(--accent);color:var(--tx);}
.filter-tab.active{
  background:var(--acc-dim);border-color:var(--accent);color:var(--accent);font-weight:700;
}

/* List body */
.list-body{
  width:100%;max-width:900px;margin:0 auto;
  padding:12px 20px 60px;
}

/* Section headers */
.sec-bld{
  font-size:.8rem;font-weight:700;letter-spacing:.06em;
  color:var(--accent);padding:12px 0 4px;
  border-bottom:1px solid var(--bd2);margin-bottom:2px;margin-top:8px;
}
.sec-bld:first-child{margin-top:0;}
.sec-st{
  font-size:.75rem;color:var(--tx3);
  padding:7px 0 2px;letter-spacing:.03em;
}

/* List items */
.list-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 4px;border-radius:4px;
  transition:background .12s;
}
.list-item:hover{background:var(--sf);}
.btn-mark{
  flex-shrink:0;width:22px;margin-top:1px;
  background:none;border:none;padding:0;
  font-size:1rem;line-height:1;color:var(--tx3);
  transition:color .12s;
}
.btn-mark.marked{color:var(--accent);}
.btn-mark:hover{color:var(--accent);}
.item-body{flex:1;min-width:0;}
.item-zh{font-size:.97rem;font-weight:700;line-height:1.4;}
.item-py{font-size:.8rem;font-style:italic;color:var(--accent);margin-top:1px;}
.item-ja{font-size:.82rem;color:var(--tx2);margin-top:1px;}

/* Vocab compact layout */
.list-item.voc .item-body{
  display:grid;
  grid-template-columns:auto 1fr 1fr;
  gap:0 12px;align-items:center;
}
.list-item.voc .item-zh{font-size:1rem;}
.list-item.voc .item-py{margin-top:0;font-style:italic;}
.list-item.voc .item-ja{margin-top:0;}

/* History items */
.h-item{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:8px;
}
.h-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.h-area{font-size:.9rem;font-weight:700;}
.h-score{font-size:.9rem;font-weight:700;}
.h-row2{display:flex;gap:12px;font-size:.78rem;color:var(--tx2);}
.h-badge{
  display:inline-block;font-size:.7rem;padding:1px 6px;
  border-radius:3px;border:1px solid var(--bd);color:var(--tx3);
  margin-left:6px;
}
.h-empty{text-align:center;color:var(--tx3);padding:48px 0;font-size:.875rem;}
.h-stats{font-size:.8rem;color:var(--tx2);}
</style>
</head>
<body>

<!-- ================================================================
  ⓪ 参加者ID設定画面
  ================================================================ -->
<div id="s-setup" class="screen" style="justify-content:center;padding:40px 20px;">
  <div style="width:100%;max-width:400px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:28px 24px;">
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:8px;">参加者IDを設定してください</h2>
    <p style="font-size:.82rem;color:var(--tx2);margin-bottom:20px;line-height:1.6;">
      研究データの収集のため、匿名の参加者IDを設定します。<br>
      イニシャル＋誕生月の数字を組み合わせた形式を推奨します。<br>
      例：<strong>MK11</strong>（山田花子、11月生まれ）
    </p>
    <div style="font-size:.78rem;color:var(--tx2);margin-bottom:6px;">参加者ID（半角英数字、2〜8文字）</div>
    <input id="pidInput" type="text" maxlength="8" placeholder="例：MK11"
      autocomplete="off" autocorrect="off" spellcheck="false"
      style="width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);
             color:var(--tx);font-size:1rem;font-family:inherit;padding:10px 12px;margin-bottom:16px;">
    <button onclick="saveParticipantId()"
      style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;
             border-radius:var(--radius);font-size:.9rem;font-weight:700;">設定して始める</button>
  </div>
</div>

<!-- ================================================================
  ① HOME SCREEN
  ================================================================ -->
<div id="s-home" class="screen">
  <div class="sticky-hd">
    <div class="hd-inner">
      <div>
        <div class="hd-title">SFC 中国語学習</div>
        <div class="hd-sub">今いる場所を選んでください</div>
      </div>
      <div id="pidBadge" style="font-size:.72rem;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);padding:3px 8px;white-space:nowrap;">ID: —</div>
    </div>
  </div>
  <div class="w">
    <div class="bld-grid" id="bldList"></div>
  </div>
  <div class="home-nav w">
    <button class="btn-nav" onclick="showPhraseList(null)">フレーズ一覧</button>
    <button class="btn-nav" onclick="showVocabList(null)">単語一覧</button>
    <button class="btn-nav" onclick="goHistory()">学習履歴</button>
  </div>
</div>

<!-- ================================================================
  MODAL：状態選択 + 一覧リンク
  ================================================================ -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-bname" id="modalBname"></div>
    <div class="modal-sub">シーンを選んで練習、または一覧を見る</div>

    <div class="state-section-label">状態を選んで練習する</div>
    <div class="state-grid" id="stateGrid"></div>
    <button class="btn-state-all" id="btnAll" onclick="confirmState('all')">すべてのフレーズを練習する</button>

    <div class="modal-divider"></div>
    <div class="state-section-label">一覧を見る</div>
    <button class="modal-list-btn" id="btnModalPhrases" onclick="openModalPhrases()">このエリアのフレーズ一覧</button>
    <button class="modal-list-btn" id="btnModalVocab" onclick="openModalVocab()">このエリアの単語一覧</button>

    <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<!-- ================================================================
  ② PRACTICE SCREEN
  ================================================================ -->
<div id="s-practice" class="screen">
  <div class="prac-wrap">
    <div class="p-header">
      <span id="pArea"></span>
      <span id="pCounter"></span>
    </div>
    <div class="p-card">
      <div><span class="p-state-tag" id="pStateTag"></span></div>
      <div class="p-zh" id="pZh"></div>
      <div class="p-ja" id="pJa"></div>
      <div class="p-pinyin" id="pPinyin"></div>
      <div class="p-status idle" id="pStatus">マイクボタンを押して発音してください</div>
      <div class="p-recog" id="pRecog"></div>
    </div>
    <div class="p-btn-row">
      <button class="btn-mic" id="btnMic" onclick="doRecog()">発音する</button>
      <button class="btn-next" id="btnNext" onclick="nextItem()" style="display:none">次へ →</button>
    </div>
    <button class="btn-abort" onclick="showScreen('s-home')">中断してホームへ戻る</button>
  </div>
</div>

<!-- ================================================================
  ③ RESULT SCREEN
  ================================================================ -->
<div id="s-result" class="screen">
  <div class="res-wrap">
    <p class="r-title" id="rTitle"></p>
    <div class="r-card">
      <div class="r-big" id="rBig"></div>
      <div class="r-denom" id="rDenom"></div>
      <div class="r-rate" id="rRate"></div>
      <div class="r-comment" id="rComment"></div>
    </div>
    <div class="r-btns">
      <button class="btn-retry" onclick="retrySession()">もう一度練習する</button>
      <button class="btn-wrong" id="btnWrong" onclick="practiceWrong()">間違えたもののみ練習</button>
      <button class="btn-home-sm" onclick="showScreen('s-home')">← ホームへ戻る</button>
    </div>
  </div>
</div>

<!-- ================================================================
  ④ HISTORY SCREEN
  ================================================================ -->
<div id="s-history" class="screen">
  <div class="sticky-hd">
    <div class="hd-inner">
      <div>
        <div class="hd-title">学習履歴</div>
        <div class="h-stats" id="hStats"></div>
      </div>
      <button class="btn-back" onclick="showScreen('s-home')">← 戻る</button>
    </div>
  </div>
  <div class="list-body" id="hBody"></div>
</div>

<!-- ================================================================
  ⑤ PHRASE LIST SCREEN
  ================================================================ -->
<div id="s-phrases" class="screen">
  <div class="sticky-hd">
    <div class="hd-inner">
      <div>

/* ================================================================
   BOOKMARK STORAGE
   ================================================================ */
function getMarks(type){
  try{ return new Set(JSON.parse(localStorage.getItem("sfc_"+type+"_marks"))||[]); }catch{return new Set();}
}
function saveMarks(type, set){
  try{ localStorage.setItem("sfc_"+type+"_marks", JSON.stringify([...set])); }catch{}
}
function toggleMark(type, zh){
  const m = getMarks(type);
  if(m.has(zh)) m.delete(zh); else m.add(zh);
  saveMarks(type, m);
  return m.has(zh);
}
function isMarked(type, zh){ return getMarks(type).has(zh); }

/* ================================================================
   HOME SCREEN
   ================================================================ */
function renderBldList(){
  const el = document.getElementById("bldList");
  el.innerHTML = BLD_LIST.map(b => {
    const pd = PH[b.id]; const vd = VOCAB[b.id];
    const phCount = pd ? Object.values(pd).reduce((s,a)=>s+a.length,0) : 0;
    const vCount  = vd ? vd.length : 0;
    if(phCount === 0 && vCount === 0) return "";
    return `<div class="bld-card" onclick="selectBuilding('${b.id}',\`${b.name}\`)">
      <div class="bld-abbr">${b.abbr}</div>
      <div class="bld-info">
        <div class="bld-name">${b.name}</div>
        <div class="bld-desc">${b.desc}</div>
        <div class="bld-counts">フレーズ ${phCount} · 単語 ${vCount}</div>
      </div>
      <div class="bld-arr">›</div>
    </div>`;
  }).join("");
}

/* ================================================================
   STATE PICKER MODAL
   ================================================================ */
function selectBuilding(bid, bname){
  modalBid = bid; modalBname = bname;
  document.getElementById("modalBname").textContent = bname;

  const pd = PH[bid] || {};
  const grid = document.getElementById("stateGrid");
  grid.innerHTML = STATE_ORDER.map(st => {
    const count = (pd[st]||[]).length;
    const dis = count === 0 ? " disabled" : "";
    return `<button class="btn-state"${dis} onclick="confirmState('${st}')">
      ${SL[st]}
      <div class="s-ct">${count > 0 ? count+"フレーズ" : "なし"}</div>
    </button>`;
  }).join("");

  // すべて練習ボタン有効/無効
  const totalPh = Object.values(pd).reduce((s,a)=>s+a.length,0);
  document.getElementById("btnAll").disabled = totalPh === 0;

  document.getElementById("modalBg").classList.add("open");
}

function closeModal(e){
  if(e && e.target !== document.getElementById("modalBg")) return;
  document.getElementById("modalBg").classList.remove("open");
}
function confirmState(state){
  document.getElementById("modalBg").classList.remove("open");
  startPractice({bid:modalBid, bname:modalBname, state, mode:"phrase"});
}
function openModalPhrases(){
  document.getElementById("modalBg").classList.remove("open");
  showPhraseList(modalBid);
}
function openModalVocab(){
  document.getElementById("modalBg").classList.remove("open");
  showVocabList(modalBid);
}

/* ================================================================
   PHRASE HELPERS
   ================================================================ */
function getPhrases(bid, state){
  const d = PH[bid]; if(!d) return [];
  if(state === "all"){
    return STATE_ORDER.flatMap(s => d[s]||[]);
  }
  return d[state]||[];
}
function getAllPhrasesForBid(bid){
  const d = PH[bid]; if(!d) return [];
  return STATE_ORDER.flatMap(s => d[s]||[]);
}
function getAllPhrases(bid){
  if(bid) return getAllPhrasesForBid(bid);
  return BLD_LIST.flatMap(b => getAllPhrasesForBid(b.id));
}
function getAllVocab(bid){
  if(bid) return VOCAB[bid]||[];
  return BLD_LIST.flatMap(b => VOCAB[b.id]||[]);
}

/* ================================================================
   PRACTICE SESSION
   ================================================================ */
function startPractice({bid, bname, state='all', mode='phrase', wrongOnly=false, markedOnly=false, items:fixedItems}){
  let pool;
  if(fixedItems){
    pool = fixedItems;
  } else if(wrongOnly && sess && sess.results.length){
    pool = sess.results.filter(r=>!r.ok).map(r=>r.item);
  } else if(markedOnly){
    const marks = getMarks(mode==='phrase'?'ph':'voc');
    pool = getAllPhrases(bid) // reuse for phrase or vocab
      .concat(mode==='vocab' ? getAllVocab(bid) : [])
      .filter(x=>marks.has(x.zh));
    if(mode==='vocab'){
      pool = getAllVocab(bid).filter(v=>marks.has(v.zh));
    } else {
      pool = getAllPhrases(bid).filter(p=>marks.has(p.zh));
    }
  } else {
    pool = mode==='phrase' ? getPhrases(bid, state) : getAllVocab(bid);
  }
  if(!pool||!pool.length){ alert("練習できるアイテムがありません"); return; }
  const items = [...pool].sort(()=>Math.random()-.5).slice(0,5);
  sess = {bid, bname, state, mode, items, idx:0, correct:0, results:[]};
  showScreen("s-practice");
  loadItem();
}

function retrySession(){
  startPractice({bid:sess.bid,bname:sess.bname,state:sess.state,mode:sess.mode});
}
function practiceWrong(){
  startPractice({bid:sess.bid,bname:sess.bname,state:sess.state,mode:sess.mode,wrongOnly:true});
}

function loadItem(){
  const item = sess.items[sess.idx];
  document.getElementById("pArea").textContent =
    sess.bname + (sess.mode==="vocab" ? " [単語]" : "");
  document.getElementById("pCounter").textContent =
    (sess.idx+1)+" / "+sess.items.length;

  const tag = document.getElementById("pStateTag");
  if(sess.mode === "vocab"){
    tag.textContent = "単語練習";
    tag.style.cssText = "background:rgba(127,90,240,.18);color:#9980f2;border:1px solid #7f5af0";
  } else {
    const sc = SC[sess.state]||SC.indoor;
    tag.textContent = SL[sess.state];
    tag.style.cssText = `background:${sc}30;color:${sc};border:1px solid ${sc}`;
  }

  document.getElementById("pZh").textContent = item.zh;
  document.getElementById("pJa").textContent = item.ja;
  document.getElementById("pPinyin").textContent = "";
  document.getElementById("pPinyin").className = "p-pinyin";
  document.getElementById("pRecog").textContent = "";
  setStatus("idle","マイクボタンを押して発音してください");
  document.getElementById("btnNext").style.display = "none";
  document.getElementById("btnMic").style.display = "";
  resetMic();
}

function nextItem(){
  sess.idx++;
  if(sess.idx >= sess.items.length){ saveHistory(); showResult(); }
  else loadItem();
}

/* ================================================================
   SPEECH RECOGNITION
   ================================================================ */
function doRecog(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ setStatus("ng","Chrome / Edgeで開いてください（Web Speech API対応ブラウザ）"); return; }
  if(recog){ try{ recog.stop(); }catch(e){} }
  recog = new SR();
  recog.lang = "zh-CN";
  recog.continuous = false;
  recog.interimResults = false;
  recog.onstart = () => {
    const b=document.getElementById("btnMic");
    b.classList.add("rec"); b.textContent="● 聞いています...";
    setStatus("listening","発音してください...");
  };
  recog.onresult = e => {
    const t = e.results[0][0].transcript;
    document.getElementById("pRecog").textContent = "認識："+t;
    judge(t);
  };
  recog.onerror = e => { setStatus("ng","エラー："+e.error); resetMic(); };
  recog.onend   = () => resetMic();
  recog.start();
}

function judge(rec){
  const item = sess.items[sess.idx];
  const keys = item.k || [item.zh];
  const ok = keys.some(k => rec.includes(k));
  const pp = document.getElementById("pPinyin");
  pp.textContent = item.py;
  pp.className = "p-pinyin "+(ok?"ok":"ng");
  if(ok){ sess.correct++; setStatus("ok","正解！"); }
  else { setStatus("ng","不正解　↑ ピンインを確認してください"); }
  sess.results.push({item, ok});
  const isLast = sess.idx >= sess.items.length-1;
  const bn = document.getElementById("btnNext");
  bn.textContent = isLast ? "結果を見る →" : "次へ →";
  bn.style.display = "";
  document.getElementById("btnMic").style.display = "none";
}

function setStatus(type, msg){
  const el = document.getElementById("pStatus");
  el.className = "p-status "+type; el.textContent = msg;
}
function resetMic(){
  const b = document.getElementById("btnMic");
  b.classList.remove("rec"); b.textContent = "発音する";
}

/* ================================================================
   RESULT SCREEN
   ================================================================ */
function showResult(){
  const tot  = sess.items.length;
  const rate = Math.round(sess.correct/tot*100);
  const big  = document.getElementById("rBig");
  big.textContent = sess.correct;
  big.style.color = rate>=80?"#2cb67d":rate>=60?"#ff8906":"#ef4565";
  document.getElementById("rTitle").textContent =
    sess.bname+"（"+(sess.mode==="vocab"?"単語練習":SL[sess.state])+"）";
  document.getElementById("rDenom").textContent   = "/ "+tot+" 問正解";
  document.getElementById("rRate").textContent    = rate+"%";
  document.getElementById("rComment").textContent =
    rate===100?"パーフェクト！":rate>=80?"よくできました！":rate>=60?"あと少し！":"もう一度練習しよう";
  const wrongs = sess.results.filter(r=>!r.ok).length;
  const bw = document.getElementById("btnWrong");
  bw.style.display = wrongs>0?"":"none";
  bw.textContent = sess.mode==="vocab"?"間違えた単語だけ練習":"間違えたフレーズだけ練習";
  showScreen("s-result");
}

/* ================================================================
   HISTORY
   ================================================================ */
function saveHistory(){
  const h = getHistory();
  h.unshift({
    date: new Date().toLocaleString("ja-JP"),
    bname: sess.bname, state: sess.state, mode: sess.mode,
    correct: sess.correct, total: sess.items.length
  });
  try{ localStorage.setItem("sfc_zh_hist", JSON.stringify(h.slice(0,60))); }catch(e){}

  // GASへログ送信
  sendLog({
    participant_id: getParticipantId(),
    condition: "manual",
    mode: sess.mode,
    total_items: sess.items.length,
    correct: sess.correct,
    accuracy: parseFloat((sess.correct / (sess.items.length || 1)).toFixed(3)),
    duration_sec: null,
    timestamp: new Date().toISOString(),
    session_id: Date.now().toString(36)
  });
}
function getHistory(){
  try{ return JSON.parse(localStorage.getItem("sfc_zh_hist"))||[]; }catch{return [];}
}
function goHistory(){
  const h = getHistory();
  document.getElementById("hStats").textContent = "全"+h.length+"セッション";
  const body = document.getElementById("hBody");
  if(!h.length){
    body.innerHTML = '<div class="h-empty">まだ練習記録がありません</div>';
  } else {
    body.innerHTML = h.map(r => {
      const rt = Math.round(r.correct/r.total*100);
      const c  = rt>=80?"#2cb67d":rt>=60?"#ff8906":"#ef4565";
      const badge = r.mode==="vocab"?'<span class="h-badge">単語</span>':'<span class="h-badge">フレーズ</span>';
      return `<div class="h-item">
        <div class="h-row1">
          <span class="h-area">${r.bname}${badge}</span>
          <span class="h-score" style="color:${c}">${r.correct}/${r.total}（${rt}%）</span>
        </div>
        <div class="h-row2">
          <span>${r.date}</span>
          <span>${r.mode==="vocab"?"単語練習":SL[r.state]}</span>
        </div>
      </div>`;
    }).join("");
  }
  showScreen("s-history");
}

/* ================================================================
   PHRASE LIST
   ================================================================ */
function showPhraseList(bid){
  phListBid = bid;
  document.getElementById("phTitle").textContent =
    bid ? (BLD_LIST.find(b=>b.id===bid)?.name||"") + "のフレーズ一覧" : "全エリア フレーズ一覧";
  renderPhFilterTabs();
  renderPhraseList();
  showScreen("s-phrases");
}

function renderPhFilterTabs(){
  const tabs = document.getElementById("phFilterTabs");
  const all  = `<span class="filter-tab${!phListBid?" active":""}" onclick="setPhFilter(null)">すべて</span>`;
  const blds = BLD_LIST.map(b => {
    const active = phListBid===b.id?" active":"";
    return `<span class="filter-tab${active}" onclick="setPhFilter('${b.id}')">${b.name.split("（")[0]}</span>`;
  }).join("");
  tabs.innerHTML = all + blds;
}
function setPhFilter(bid){
  phListBid = bid;
  document.getElementById("phTitle").textContent =
    bid ? (BLD_LIST.find(b=>b.id===bid)?.name||"") + "のフレーズ一覧" : "全エリア フレーズ一覧";
  renderPhFilterTabs();
  renderPhraseList();
}

function renderPhraseList(){
  const marks = getMarks("ph");
  const blds  = phListBid ? [BLD_LIST.find(b=>b.id===phListBid)].filter(Boolean) : BLD_LIST;
  let html = "";
  for(const b of blds){
    const pd = PH[b.id]; if(!pd) continue;
    if(!phListBid) html += `<div class="sec-bld">${b.abbr}&nbsp;&nbsp;${b.name}</div>`;
    for(const st of STATE_ORDER){
      const phs = pd[st]||[];
      if(!phs.length) continue;
      html += `<div class="sec-st">▸ ${SL[st]}</div>`;
      for(const ph of phs){
        const marked = marks.has(ph.zh);
        html += `<div class="list-item">
          <button class="btn-mark${marked?" marked":""}" onclick="togglePhMarkEl('${ph.zh.replace(/'/g,"\\'").replace(/\\/g,"\\\\").replace(/"/g,'\\"')}',this)" aria-label="ブックマーク">${marked?"★":"☆"}</button>
          <div class="item-body">
            <div class="item-zh">${ph.zh}</div>
            <div class="item-py">${ph.py}</div>
            <div class="item-ja">${ph.ja}</div>
          </div>
        </div>`;
      }
    }
  }
  document.getElementById("phBody").innerHTML = html || '<div class="h-empty">フレーズがありません</div>';
}

function togglePhMarkEl(zh, btn){
  const marked = toggleMark("ph", zh);
  btn.textContent = marked ? "★" : "☆";
  btn.classList.toggle("marked", marked);
}

function practiceMarkedPhrases(){
  const bid = phListBid;
  const bname = bid ? (BLD_LIST.find(b=>b.id===bid)?.name||"") : "全エリア";
  startPractice({bid, bname, state:"all", mode:"phrase", markedOnly:true});
}

function setVocFilter(bid){

  document.getElementById("vocTitle").textContent =

function renderVocabList(){
  const marks = getMarks("voc");
  const blds  = vocListBid ? [BLD_LIST.find(b=>b.id===vocListBid)].filter(Boolean) : BLD_LIST;
  let html = "";
  for(const b of blds){
    const vd = VOCAB[b.id]; if(!vd||!vd.length) continue;
    if(!vocListBid) html += `<div class="sec-bld">${b.abbr}&nbsp;&nbsp;${b.name}</div>`;
    for(const v of vd){
      const marked = marks.has(v.zh);
      html += `<div class="list-item voc">
        <button class="btn-mark${marked?" marked":""}" onclick="toggleVocMarkEl('${v.zh.replace(/'/g,"\\'").replace(/\\/g,"\\\\").replace(/"/g,'\\"')}',this)" aria-label="ブックマーク">${marked?"★":"☆"}</button>
        <div class="item-body">
          <div class="item-zh">${v.zh}</div>
          <div class="item-py">${v.py}</div>
          <div class="item-ja">${v.ja}</div>
        </div>
      </div>`;
    }
  }
  document.getElementById("vocBody").innerHTML = html || '<div class="h-empty">単語がありません</div>';

function toggleVocMarkEl(zh, btn){

  btn.textContent = marked ? "★" : "☆";
  btn.classList.toggle("marked", marked);
}

  startPractice({bid, bname, state:"all", mode:"vocab", markedOnly:true});
}

/* ================================================================
   SCREEN SWITCH
   ================================================================ */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

/* ================================================================
   BOOT
   ================================================================ */
(function init(){
  const pid = getParticipantId();
  if(!pid){
    showScreen("s-setup");
  } else {
    document.getElementById("pidBadge").textContent = "ID: " + pid;
    showScreen("s-home");
    renderBldList();
  }
})();
