<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SFC 中国語フレーズ学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#000000;color:#ffffff;min-height:100vh;overflow-x:hidden;line-height:1.5;}
.screen{display:none;flex-direction:column;align-items:center;min-height:100vh;}
.screen.active{display:flex;}

/* ===== MAP ===== */
#s-map{justify-content:flex-start;padding:0;}
.map-header{width:100%;padding:14px 16px 10px;background:linear-gradient(180deg,#000000 60%,transparent);position:sticky;top:0;z-index:10;}
.map-title{font-size:1.05rem;font-weight:700;margin-bottom:6px;}
.badges{display:flex;flex-wrap:wrap;gap:6px;}
.badge{font-size:.875rem;font-weight:700;padding:3px 10px;border-radius:4px;}
.b-area{background:#111a2e;color:#80aaff;}
.b-approaching{background:rgba(44,182,125,.18);color:#2cb67d;border:1px solid #2cb67d;}
.b-indoor{background:rgba(127,90,240,.18);color:#9980f2;border:1px solid #9980f2;}
.b-outdoor{background:rgba(255,137,6,.15);color:#ff8906;border:1px solid #ff8906;}
.b-departing{background:rgba(239,69,101,.15);color:#ef4565;border:1px solid #ef4565;}
.b-qzss{background:rgba(44,182,125,.1);color:#2cb67d;}
.b-gps{background:rgba(255,137,6,.1);color:#ff8906;}
.b-wait{background:rgba(200,200,200,.1);color:#aaaaaa;}
#svgWrap{width:100%;max-width:600px;margin:0 auto;}
#svgWrap svg{width:100%;display:block;}
.map-footer{width:100%;padding:12px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.info-box{width:100%;max-width:540px;background:#111111;border-radius:8px;padding:12px 16px;font-size:.875rem;color:#aaaaaa;text-align:center;line-height:1.5;border:1px solid #222222;}
.info-box strong{color:#ffffff;}
.btn-start{width:100%;max-width:540px;padding:15px;background:#7f5af0;color:#fff;border:none;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;}
.btn-start:hover:not(:disabled){background:#6b46e0;}
.btn-start:disabled{background:#1a1a1a;color:#555555;cursor:default;}
.map-nav{display:flex;gap:10px;width:100%;max-width:540px;}
.btn-nav{flex:1;padding:10px;background:#111111;border:1px solid #333333;color:#aaaaaa;border-radius:4px;font-size:.875rem;cursor:pointer;transition:.2s;}
.btn-nav:hover{border-color:#7f5af0;color:#ffffff;}

/* ===== PRACTICE ===== */
#s-practice{justify-content:center;padding:20px 16px;}
.p-header{width:100%;max-width:520px;display:flex;justify-content:space-between;margin-bottom:14px;font-size:.875rem;color:#aaaaaa;}
.p-card{background:#111111;border-radius:8px;padding:32px 24px 22px;width:100%;max-width:520px;text-align:center;margin-bottom:12px;border:1px solid #222222;}
.p-state{display:inline-block;font-size:.875rem;font-weight:700;padding:3px 10px;border-radius:4px;margin-bottom:12px;}
.p-zh{font-size:1.55rem;font-weight:700;line-height:1.4;margin-bottom:10px;}
.p-ja{font-size:.875rem;color:#777777;margin-bottom:8px;}
.p-pinyin{font-size:1.4rem;font-style:italic;min-height:2rem;margin-bottom:6px;transition:.3s;}
.p-pinyin.ok{color:#2cb67d;}
.p-pinyin.ng{color:#ff8906;}
.p-status{font-size:.875rem;min-height:1.8rem;padding:6px 12px;border-radius:4px;margin-top:6px;transition:.3s;}
.p-status.idle{color:#555555;}
.p-status.listening{color:#9980f2;background:rgba(127,90,240,.1);}
.p-status.ok{color:#2cb67d;background:rgba(44,182,125,.1);}
.p-status.ng{color:#ff8906;background:rgba(255,137,6,.1);}
.p-recog{font-size:.875rem;color:#555555;min-height:1.1rem;margin-top:3px;}
.btn-row{display:flex;gap:10px;width:100%;max-width:520px;}
.btn-mic{flex:1;padding:14px;background:#7f5af0;color:#fff;border:none;border-radius:4px;font-size:.875rem;font-weight:700;cursor:pointer;transition:.2s;}
.btn-mic:hover{background:#6b46e0;}
.btn-mic.rec{background:#ef4565;animation:pulse 1.2s infinite;}
.btn-next{flex:1;padding:14px;background:#2cb67d;color:#fff;border:none;border-radius:4px;font-size:.875rem;font-weight:700;cursor:pointer;transition:.2s;}
.btn-next:hover{background:#249f60;}
.btn-abort{background:transparent;border:1px solid #333333;color:#aaaaaa;font-size:.875rem;padding:8px 18px;border-radius:4px;cursor:pointer;margin-top:8px;transition:.2s;}
.btn-abort:hover{border-color:#ef4565;color:#ef4565;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,69,101,.4);}50%{box-shadow:0 0 0 12px rgba(239,69,101,0);}}

/* ===== RESULT ===== */
#s-result{justify-content:center;padding:20px 16px;}
.r-title{font-size:.95rem;color:#aaaaaa;margin-bottom:14px;text-align:center;}
.r-card{background:#111111;border-radius:8px;padding:34px;width:100%;max-width:380px;text-align:center;margin-bottom:18px;border:1px solid #222222;}
.r-big{font-size:4.5rem;font-weight:700;line-height:1;margin-bottom:4px;}
.r-denom{font-size:1.1rem;color:#aaaaaa;margin-bottom:12px;}
.r-rate{font-size:1.7rem;font-weight:700;margin-bottom:5px;}
.r-comment{font-size:.875rem;color:#aaaaaa;}
.r-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;}
.btn-retry{background:#7f5af0;color:#fff;padding:13px;border:none;border-radius:4px;font-size:.875rem;font-weight:700;cursor:pointer;}
.btn-retry:hover{background:#6b46e0;}
.btn-wrong{background:#ef4565;color:#fff;padding:13px;border:none;border-radius:4px;font-size:.875rem;font-weight:700;cursor:pointer;}
.btn-wrong:hover{background:#d02040;}
.btn-home{background:#111111;color:#aaaaaa;padding:11px;border:1px solid #333333;border-radius:4px;font-size:.875rem;cursor:pointer;}
.btn-home:hover{border-color:#aaaaaa;color:#fff;}

/* ===== SCROLL SCREENS ===== */
#s-history,#s-phrases{justify-content:flex-start;padding:0;}
.sc-header{position:sticky;top:0;z-index:10;background:#000000;border-bottom:1px solid #222222;width:100%;padding:12px 18px;}
.sc-htop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sc-title{font-size:1rem;font-weight:700;}
.btn-close{background:none;border:none;color:#9980f2;font-size:.875rem;cursor:pointer;}
.sc-sub{font-size:.875rem;color:#555555;}
.sc-body{width:100%;max-width:600px;padding:14px 18px 56px;}

/* history */
.h-item{background:#111111;border-radius:8px;padding:13px 16px;margin-bottom:8px;border:1px solid #222222;}
.h-r1{display:flex;justify-content:space-between;margin-bottom:4px;}
.h-area{font-size:.9rem;font-weight:700;}
.h-score{font-size:.9rem;font-weight:700;}
.h-r2{display:flex;gap:10px;font-size:.875rem;color:#aaaaaa;}
.h-empty{text-align:center;color:#555555;padding:40px 0;font-size:.875rem;}

/* phrase list */
.ph-bld{font-size:.875rem;font-weight:700;letter-spacing:.05em;padding:13px 0 4px;border-bottom:1px solid #222222;margin-top:4px;color:#9980f2;}
.ph-st{font-size:.875rem;color:#555555;padding:7px 0 2px;}
.ph-item{display:flex;align-items:flex-start;gap:8px;padding:7px 4px;border-radius:4px;transition:background .15s;}
.ph-item:hover{background:#111111;}
.ph-item.wrong{background:rgba(255,137,6,.06);}
.ph-mark{font-size:.875rem;flex-shrink:0;margin-top:2px;width:16px;}
.ph-zh{font-size:.97rem;font-weight:700;}
.ph-py{font-size:.875rem;font-style:italic;color:#9980f2;}
.ph-ja{font-size:.875rem;color:#aaaaaa;}
</style>
</head>
<body>

<!-- ① MAP SCREEN -->

<!-- ② PRACTICE SCREEN -->
<div id="s-practice" class="screen">
  <div class="p-header">
    <span id="pArea"></span>
    <span id="pCounter"></span>
  </div>
  <div class="p-card">
    <div><span class="p-state" id="pStateTag"></span></div>
    <div class="p-zh" id="pZh"></div>
    <div class="p-ja" id="pJa"></div>
    <div class="p-pinyin" id="pPinyin"></div>
    <div class="p-status idle" id="pStatus">マイクボタンを押して発音してください</div>
    <div class="p-recog" id="pRecog"></div>
  </div>
  <div class="btn-row">
    <button class="btn-mic" id="btnMic" onclick="doRecog()">発音する</button>
    <button class="btn-next" id="btnNext" onclick="nextPhrase()" style="display:none">次へ →</button>

  <button class="btn-abort" onclick="showScreen('s-map')">中断してホームへ戻る</button>
</div>

<!-- ③ RESULT SCREEN -->
<div id="s-result" class="screen">
  <p class="r-title" id="rTitle"></p>
  <div class="r-card">
    <div class="r-big" id="rBig"></div>
    <div class="r-denom" id="rDenom"></div>

    <div class="r-comment" id="rComment"></div>
  </div>

</div>

<!-- ④ HISTORY SCREEN -->

  <div class="sc-header">
    <div class="sc-htop">
      <span class="sc-title">学習履歴</span>
      <button class="btn-close" onclick="showScreen('s-map')">← 戻る</button>
    </div>

      <button class="btn-close" onclick="showScreen('s-map')">← 戻る</button>

  </div>
  <div class="sc-body" id="phBody"></div>
</div>

<script>
// ============================================================
// DATA: 建物
// ============================================================
const BUILDINGS = [
  {id:"bus",    name:"バス停A・B",                lat:35.386208,lng:139.424284,r:80, indoor:false},
  {id:"mu",     name:"Μ館（メディアセンター）",   lat:35.387608,lng:139.424384,r:70, indoor:true},
  {id:"alpha",  name:"Α館",                       lat:35.386808,lng:139.426584,r:70, indoor:true},
  {id:"sigma",  name:"Σ館",                       lat:35.387408,lng:139.425384,r:75, indoor:true},
  {id:"lecture",name:"講義棟（κ・ε・ι・ο・λ・Θ）",lat:35.388573,lng:139.426533,r:95, indoor:true},
  {id:"tau",    name:"τ館",                       lat:35.388943,lng:139.425935,r:65, indoor:true},
  {id:"gamma",  name:"Γ館（体育館）",              lat:35.388708,lng:139.427284,r:65, indoor:true},
  {id:"beta",   name:"βヴィレッジ",               lat:35.386808,lng:139.427284,r:70, indoor:true},
  {id:"pond",   name:"鴨池・学生ラウンジ",          lat:35.388908,lng:139.425184,r:80, indoor:false},
];

// キャンパス全体の境界（建物未検出時の判定用）
const CAMPUS_CENTER = {lat:35.388008, lng:139.425784};
const CAMPUS_R = 500; // meters（実測座標に基づき修正済み）

function isOnCampus(lat,lng){
  return haversine(lat,lng,CAMPUS_CENTER.lat,CAMPUS_CENTER.lng) < CAMPUS_R;
}

// SVG座標変換（GPS→SVG px）

const SVG0 = {x:198, y:366};
const LPL  = 62647;  // px per degree lat
const LPLg = 144782; // px per degree lng

function g2s(lat,lng){
  return {x: SVG0.x+(lng-GPS0.lng)*LPLg, y: SVG0.y-(lat-GPS0.lat)*LPL};
}

let watchId=null, curPos=null, prevPos=null;
let curBld=null, curState=null;
let sess=null;   // {bid,bname,state,phrases,idx,correct,results[]}
let recog=null;

// ============================================================
// GPS
// ============================================================
function startGPS(){
  if(!navigator.geolocation){
    setInfo("このブラウザは位置情報に対応していません"); return;
  }
  watchId = navigator.geolocation.watchPosition(onPos, onErr,
    {enableHighAccuracy:true, maximumAge:0, timeout:15000});
}

function onPos(p){
  prevPos=curPos; curPos=p;
  const acc=p.coords.accuracy;

  // 精度バッジ
  const ba=document.getElementById("bAcc");
  ba.style.display="";
  if(acc<=5){ba.textContent="QZSS ±"+acc.toFixed(1)+"m";ba.className="badge b-qzss";}
  else if(acc<=15){ba.textContent="GPS ±"+acc.toFixed(0)+"m";ba.className="badge b-gps";}
  else{ba.textContent="精度待ち ±"+acc.toFixed(0)+"m";ba.className="badge b-wait";}

  // デバッグ座標表示
  const dbg=document.getElementById("debugCoords");
  if(dbg){
    const dist=haversine(p.coords.latitude,p.coords.longitude,CAMPUS_CENTER.lat,CAMPUS_CENTER.lng);
    dbg.textContent="📍 "+p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6)+" | 中心から"+dist.toFixed(0)+"m | 精度±"+acc.toFixed(0)+"m";
  }

  // 最近傍建物
  const nr=findNearest(p.coords.latitude,p.coords.longitude);
  curBld   = nr.bld;
  curState = nr.bld ? detectState(p,nr) : null;

  updatePin(p);
  updateBldHighlight();
  updateBadges();
  updateStartBtn();
}

function onErr(e){setInfo("位置情報の取得に失敗しました（"+e.message+"）");}

function findNearest(lat,lng){
  let best=null, bd=Infinity;
  for(const b of BUILDINGS){
    const d=haversine(lat,lng,b.lat,b.lng);
    if(d<b.r && d<bd){bd=d;best=b;}
  }
  return {bld:best,dist:bd};
}

function detectState(p,nr){
  const acc=p.coords.accuracy, b=nr.bld;
  if(b.indoor && acc>10) return "indoor";
  if(prevPos){
    const pd=haversine(prevPos.coords.latitude,prevPos.coords.longitude,b.lat,b.lng);
    const cd=nr.dist;
    const sp=p.coords.speed||estSpeed(prevPos,p);
    if(cd<pd-2 && sp>0.3) return "approaching";
    if(cd>pd+2) return "departing";
  }
  return "outdoor";
}

function estSpeed(p1,p2){
  const d=haversine(p1.coords.latitude,p1.coords.longitude,p2.coords.latitude,p2.coords.longitude);
  const t=(p2.timestamp-p1.timestamp)/1000;
  return t>0?d/t:0;
}

function haversine(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ============================================================
// MAP UI
// ============================================================
function updatePin(p){
  const s=g2s(p.coords.latitude,p.coords.longitude);
  for(const id of["pin-dot","pin-ring"]){
    document.getElementById(id).setAttribute("cx",s.x.toFixed(1));
    document.getElementById(id).setAttribute("cy",s.y.toFixed(1));
  }
}

function updateBldHighlight(){
  document.querySelectorAll("[data-bid]").forEach(el=>{
    const orig = el.getAttribute("data-orig-stroke") || el.getAttribute("stroke");
    if(!el.getAttribute("data-orig-stroke")) el.setAttribute("data-orig-stroke",orig);
    el.setAttribute("stroke", orig);
  });
  if(curBld && curState){
    const el=document.querySelector("[data-bid='"+curBld.id+"']");
    if(el) el.setAttribute("stroke",SC[curState]);
  }
}

function updateBadges(){
  const ba=document.getElementById("bArea"), bs=document.getElementById("bState");
  if(curBld){
    ba.textContent=curBld.name;
    bs.style.display="";
    bs.textContent=SL[curState];
    bs.className="badge b-"+curState;
    setInfo("<strong>"+curBld.name+"</strong> 付近（"+SL[curState]+"）のフレーズが表示されます");
  } else if(curPos && isOnCampus(curPos.coords.latitude,curPos.coords.longitude)){
    ba.textContent="建物に近づいてください";
    bs.style.display="none";
    setInfo("建物の近くに来ると、場所に合ったフレーズに切り替わります。");
  } else {
    ba.textContent="SFCキャンパス外";
    bs.style.display="none";
    setInfo("SFCキャンパス内に入るとフレーズが表示されます。");
  }
}

function updateStartBtn(){
  const btn=document.getElementById("btnStart");
  const phs=getPhrases(curBld?curBld.id:null,curState);
  if(curBld && curState && phs.length>0){
    btn.disabled=false;
    btn.textContent=curBld.name+"のフレーズを練習する";
  } else {
    btn.disabled=true;
    btn.textContent="フレーズ練習を始める";
  }
}

function setInfo(html){document.getElementById("infoBox").innerHTML=html;}

// ============================================================
// PHRASES
// ============================================================
function getPhrases(bid,state){
  if(!bid||!state) return [];
  const d=PH[bid]; if(!d) return [];
  return d[state]||d["outdoor"]||[];
}

// ============================================================
// SESSION
// ============================================================
function startSession(wrongOnly){
  const bid=curBld?curBld.id:null;
  const bname=curBld?curBld.name:"フリー練習";
  const st=curState||"outdoor";

  let pool;
  if(wrongOnly && sess && sess.results.length>0){
    pool=sess.results.filter(r=>!r.ok).map(r=>r.ph);
  } else {
    pool=getPhrases(bid,st);
  }
  if(!pool||pool.length===0){alert("このエリアにフレーズがありません");return;}

  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,5);
  sess={bid,bname,state:st,phrases:shuffled,idx:0,correct:0,results:[]};
  showScreen("s-practice");
  loadPhrase();
}

function retrySession(){startSession(false);}
function practiceWrong(){startSession(true);}

function loadPhrase(){
  const ph=sess.phrases[sess.idx];
  document.getElementById("pArea").textContent=sess.bname;
  document.getElementById("pCounter").textContent=(sess.idx+1)+" / "+sess.phrases.length;

  const tag=document.getElementById("pStateTag");
  tag.textContent=SL[sess.state];
  tag.style.cssText="background:"+SC[sess.state]+"30;color:"+SC[sess.state]+";border:1px solid "+SC[sess.state];

  document.getElementById("pZh").textContent=ph.zh;
  document.getElementById("pJa").textContent=ph.ja;
  document.getElementById("pPinyin").textContent="";
  document.getElementById("pPinyin").className="p-pinyin";
  document.getElementById("pRecog").textContent="";
  setStatus("idle","マイクボタンを押して発音してください");
  document.getElementById("btnNext").style.display="none";
  document.getElementById("btnMic").style.display="";
  resetMic();
}

function nextPhrase(){
  sess.idx++;
  if(sess.idx>=sess.phrases.length){saveHistory();showResult();}
  else loadPhrase();
}

// ============================================================
// SPEECH RECOGNITION
// ============================================================
function doRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStatus("ng","Chrome/Edgeで開いてください（Web Speech API対応ブラウザ）");return;}
  if(recog){try{recog.stop();}catch(e){}}
  recog=new SR();
  recog.lang="zh-CN";
  recog.continuous=false;
  recog.interimResults=false;
  recog.onstart=()=>{
    const b=document.getElementById("btnMic");
    b.classList.add("rec");b.textContent="● 聞いています...";
    setStatus("listening","発音してください...");
  };
  recog.onresult=e=>{
    const t=e.results[0][0].transcript;
    document.getElementById("pRecog").textContent="認識："+t;
    judge(t);
  };
  recog.onerror=e=>{setStatus("ng","エラー："+e.error);resetMic();};
  recog.onend=()=>resetMic();
  recog.start();
}

function judge(rec){
  const ph=sess.phrases[sess.idx];
  const ok=ph.k.some(k=>rec.includes(k));
  const pp=document.getElementById("pPinyin");
  pp.textContent=ph.py;
  pp.className="p-pinyin "+(ok?"ok":"ng");
  if(ok){sess.correct++;setStatus("ok","正解！");}
  else{setStatus("ng","不正解　↑ ピンインを確認してください");}
  sess.results.push({ph,ok});
  const isLast=sess.idx>=sess.phrases.length-1;
  const bn=document.getElementById("btnNext");
  bn.textContent=isLast?"結果を見る →":"次へ →";
  bn.style.display="";
  document.getElementById("btnMic").style.display="none";
}

function setStatus(type,msg){
  const el=document.getElementById("pStatus");
  el.className="p-status "+type;el.textContent=msg;
}
function resetMic(){
  const b=document.getElementById("btnMic");
  b.classList.remove("rec");b.textContent="発音する";
}

// ============================================================
// RESULT
// ============================================================
function showResult(){
  const tot=sess.phrases.length;
  const rate=Math.round(sess.correct/tot*100);
  const big=document.getElementById("rBig");
  big.textContent=sess.correct;
  big.style.color=rate>=80?"#2cb67d":rate>=60?"#ff8906":"#ef4565";
  document.getElementById("rTitle").textContent=sess.bname+"（"+SL[sess.state]+"）";
  document.getElementById("rDenom").textContent="/ "+tot+" 問正解";
  document.getElementById("rRate").textContent=rate+"%";
  document.getElementById("rComment").textContent=
    rate===100?"パーフェクト！":rate>=80?"よくできました！":rate>=60?"あと少し！":"もう一度練習しよう";
  const wrongs=sess.results.filter(r=>!r.ok).length;
  document.getElementById("btnWrong").style.display=wrongs>0?"":"none";
  showScreen("s-result");
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveHistory(){
  const h=getHistory();
  h.unshift({
    date:new Date().toLocaleString("ja-JP"),
    bname:sess.bname,state:sess.state,
    correct:sess.correct,total:sess.phrases.length
  });
  try{localStorage.setItem("sfc_zh_hist",JSON.stringify(h.slice(0,60)));}catch(e){}
}
function getHistory(){
  try{return JSON.parse(localStorage.getItem("sfc_zh_hist"))||[];}catch{return [];}
}

function goHistory(){
  const h=getHistory();
  document.getElementById("hStats").textContent="全"+h.length+"セッション";
  const body=document.getElementById("hBody");
  if(!h.length){
    body.innerHTML='<div class="h-empty">まだ練習記録がありません</div>';
  } else {
    body.innerHTML=h.map(r=>{
      const rt=Math.round(r.correct/r.total*100);
      const c=rt>=80?"#2cb67d":rt>=60?"#ff8906":"#ef4565";
      return '<div class="h-item">'
        +'<div class="h-r1"><span class="h-area">'+r.bname+'</span>'
        +'<span class="h-score" style="color:'+c+'">'+r.correct+'/'+r.total+'（'+rt+'%）</span></div>'
        +'<div class="h-r2"><span>'+r.date+'</span><span>'+SL[r.state]+'</span></div>'
        +'</div>';
    }).join("");
  }
  showScreen("s-history");
}

// ============================================================
// PHRASE LIST
// ============================================================
function renderPhraseList(){
  const wrongSet=new Set(sess?sess.results.filter(r=>!r.ok).map(r=>r.ph.zh):[]);
  let html="";
  for(const b of BUILDINGS){
    const pd=PH[b.id]; if(!pd) continue;
    html+='<div class="ph-bld">'+b.name+'</div>';
    for(const sk of Object.keys(pd)){
      html+='<div class="ph-st">▸ '+SL[sk]+'</div>';
      for(const ph of pd[sk]){
        const w=wrongSet.has(ph.zh);
        html+='<div class="ph-item'+(w?" wrong":"'")+'>'
          +'<span class="ph-mark">'+(w?"✗":"")+'</span>'
          +'<div><div class="ph-zh">'+ph.zh+'</div>'
          +'<div class="ph-py">'+ph.py+'</div>'
          +'<div class="ph-ja">'+ph.ja+'</div></div>'
          +'</div>';
      }
    }
  }
  document.getElementById("phBody").innerHTML=html;
}

// ============================================================
// SCREEN
// ============================================================
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="s-phrases") renderPhraseList();
  if(id==="s-map") window.scrollTo(0,0);
}

// ============================================================
// BOOT
// ============================================================
window.addEventListener("load",startGPS);
